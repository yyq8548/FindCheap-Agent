name: plugin-ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_PROJECT_SPEC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mcp
      - run: git diff --exit-code -- plugins/findcheap-agent/dist/mcp-server.js
      - run: git diff --exit-code -- plugins/findcheap-agent/dist/mcp-server.meta.json
      - run: git diff --exit-code -- plugins/findcheap-agent/THIRD_PARTY_NOTICES.md
      - run: pnpm test:mcp-stdio
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  plugin-smoke-windows:
    runs-on: windows-latest
    env:
      COREPACK_ENABLE_PROJECT_SPEC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mcp
      - run: git diff --exit-code -- plugins/findcheap-agent/dist/mcp-server.js
      - run: git diff --exit-code -- plugins/findcheap-agent/dist/mcp-server.meta.json
      - run: git diff --exit-code -- plugins/findcheap-agent/THIRD_PARTY_NOTICES.md
      - run: pnpm test:mcp-stdio
