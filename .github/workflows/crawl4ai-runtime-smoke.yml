name: Crawl4AI runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and exercise isolated worker runtime
        env:
          RUN_CRAWL4AI_RUNTIME_SMOKE: "1"
        run: python scripts/test-crawl4ai-runtime.py
