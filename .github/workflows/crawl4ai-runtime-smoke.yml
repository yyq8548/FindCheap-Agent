name: Crawl4AI runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crawl4ai-runtime-smoke.yml"
      - "docker-compose.yml"
      - "infra/docker/crawl4ai*"
      - "scripts/test-crawl4ai-runtime.py"
      - "services/crawl4ai-worker/**"
      - "tests/runtime/**"
      - "tests/security/crawler-egress.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl4ai-runtime-smoke.yml"
      - "docker-compose.yml"
      - "infra/docker/crawl4ai*"
      - "scripts/test-crawl4ai-runtime.py"
      - "services/crawl4ai-worker/**"
      - "tests/runtime/**"
      - "tests/security/crawler-egress.test.ts"

concurrency:
  group: crawl4ai-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-smoke:
    # Namespace syscall probes below are intentionally x86_64-specific.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/crawl4ai-worker/requirements.lock
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r services/crawl4ai-worker/requirements.lock
      - name: Run Crawl4AI worker Python tests
        run: python -m pytest services/crawl4ai-worker/tests
      - name: Build and exercise isolated worker runtime
        env:
          RUN_CRAWL4AI_RUNTIME_SMOKE: "1"
        run: python scripts/test-crawl4ai-runtime.py
