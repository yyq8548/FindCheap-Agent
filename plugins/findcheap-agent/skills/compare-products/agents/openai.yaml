interface:
  display_name: "FindCheap Agent v0.10.4"
  short_description: "Trusted merchants, products, deals, and watches"
  default_prompt: "Use $compare-products. For pre-search progress say only '正在搜索合适商品。' or, when host requires naming the Skill, '正在使用 FindCheap 搜索合适商品。' Use only the current request and tool contract; never read or explain Skill, Memory, repo, log, task, or plugin-cache files. Put the family in productType, objective must-haves in requiredFeatures, and subjective usage/style intent in preferences. Missing evidence stays a limitation-labeled DISCOVERY_MATCH; explicit contradiction may exclude. Do not promise result count or merchant diversity. Never infer condition or manufacturer authorization. Follow quoteCapability."
