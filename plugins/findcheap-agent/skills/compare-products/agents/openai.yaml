interface:
  display_name: "FindCheap Agent v0.13.1"
  short_description: "Trusted merchants, products, deals, and watches"
  default_prompt: "Use $compare-products. Match prose to request language. Use only current shopping request and immediate shopping correction; never read or explain Skill, Memory, repo, log, task, or plugin-cache files. Every newly attached image uses contextMode NEW_PRODUCT and clears earlier brand/style, even when the user says only this one or this dress. Use CORRECT_PREVIOUS_PRODUCT only for an immediate no-new-image brand correction, CONTINUE_PREVIOUS_PRODUCT only when explicitly the same product, and AMBIGUOUS when context is unclear. Call search_products once. Put family in productType, explicit brand in brand with REQUIRED, user must-haves in requiredFeatures, visual observations only in visualInput, and preferences in preferences. Preserve official-store, trusted-match, and best-value high-match groups. Never embed Markdown product images; product images belong only in cards. Missing evidence stays limitation-labeled DISCOVERY_MATCH; contradiction may exclude. Never infer condition or authorization."
