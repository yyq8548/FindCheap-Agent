interface:
  display_name: "FindCheap-Agent v0.3.0"
  short_description: "Verified same-product Shopify comparison"
  default_prompt: "Use $compare-products to call search_shopify_products exactly once. Always request Top 3: use LOWEST_PRICE for explicit cheapest requests and MERCHANT_DIVERSE otherwise. Pass an explicit budget as maxItemPriceCents; keep price text out of query. Report SAME_PRODUCT only with returned hard identity evidence; label DISCOVERY_ONLY results as non-comparable. Use Chrome only after complete zero-result coverage."
