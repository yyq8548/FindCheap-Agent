http_port 3128
cache deny all
access_log none
cache_log /dev/null
forwarded_for delete
via off

acl CONNECT method CONNECT
acl ssl_ports port 443
acl numeric_ipv4 url_regex -i ^[a-z][a-z]*://[0-9] ^[0-9][0-9]*\.
acl numeric_ipv6 url_regex -i ^[a-z][a-z]*://\[ ^\[
acl blocked_networks dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl audited_hosts dstdomain "/etc/squid/allowed-hosts.txt"

# CONNECT is opaque without TLS interception, so the application evidence cap remains
# authoritative. This also caps any non-tunneled audited response if policy evolves.
reply_body_max_size 2 MB audited_hosts

http_access deny numeric_ipv4
http_access deny numeric_ipv6
http_access deny blocked_networks
http_access allow CONNECT audited_hosts ssl_ports
http_access deny all
