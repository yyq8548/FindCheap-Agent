services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: shopping
    ports: ["5432:5432"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  crawl4ai-worker:
    profiles: ["dynamic-crawl"]
    build:
      context: .
      dockerfile: infra/docker/crawl4ai.Dockerfile
    depends_on:
      - crawl4ai-egress
    environment:
      CRAWLER_EGRESS_ENFORCED: "true"
      CRAWLER_MERCHANTS_CONFIG: /app/config/merchants.json
      CRAWLER_PROXY_URL: http://crawl4ai-egress:3128
    networks: ["crawler-internal"]
    expose: ["8080"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp:infra/docker/crawl4ai-seccomp.json
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 768m

  crawl4ai-egress:
    profiles: ["dynamic-crawl"]
    image: ubuntu/squid:6.10-24.10_edge
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    configs:
      - source: crawl4ai_squid_config
        target: /etc/squid/squid.conf
      - source: crawl4ai_allowed_hosts
        target: /etc/squid/allowed-hosts.txt
    networks: ["crawler-internal", "crawler-outbound"]
    read_only: true
    tmpfs:
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=16m
      - /run:rw,noexec,nosuid,nodev,size=4m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m

networks:
  crawler-internal:
    internal: true
  crawler-outbound: {}

configs:
  crawl4ai_squid_config:
    file: ./infra/docker/crawl4ai-squid.conf
  crawl4ai_allowed_hosts:
    file: ./infra/docker/crawl4ai-allowed-hosts.txt
