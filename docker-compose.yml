# Development-only dependencies. Do not expose these local credentials in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: shopping
    ports: ["5432:5432"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  commerce-api:
    profiles: ["commerce"]
    build:
      context: .
      dockerfile: infra/docker/commerce-api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMMERCE_DATABASE_URL:-}
      COMMERCE_API_TOKEN: ${COMMERCE_API_TOKEN:-}
      COMMERCE_API_HOST: 0.0.0.0
      COMMERCE_API_PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m

  awin-feed-service:
    profiles: ["awin"]
    build:
      context: .
      dockerfile: infra/docker/awin-feed-service.Dockerfile
    environment:
      NODE_ENV: production
      AWIN_SOURCE_FEED_URL: ${AWIN_SOURCE_FEED_URL:-}
      AWIN_SOURCE_FEED_URL_2: ${AWIN_SOURCE_FEED_URL_2:-}
      AWIN_SOURCE_ALLOWED_HOSTS: ${AWIN_SOURCE_ALLOWED_HOSTS:-productdata.awin.com,datafeed.api.productserve.com}
      AWIN_FEED_API_TOKEN: ${AWIN_FEED_API_TOKEN:-}
      AWIN_FEED_DATA_PATH: /data/current.csv.gz
      AWIN_REFRESH_INTERVAL_MINUTES: ${AWIN_REFRESH_INTERVAL_MINUTES:-360}
      AWIN_SOURCE_TIMEOUT_MS: ${AWIN_SOURCE_TIMEOUT_MS:-15000}
      AWIN_FEED_SERVICE_HOST: 0.0.0.0
      AWIN_FEED_SERVICE_PORT: 3010
    ports: ["127.0.0.1:3010:3010"]
    volumes: ["awin_feed_data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    cpus: 0.5
    mem_limit: 128m

volumes:
  awin_feed_data:
