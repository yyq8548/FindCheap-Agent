# Development-only dependencies. Do not expose these local credentials in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: shopping
    ports: ["5432:5432"]
  awin-feed-service:
    profiles: ["awin"]
    build:
      context: .
      dockerfile: infra/docker/awin-feed-service.Dockerfile
    environment:
      NODE_ENV: production
      AWIN_SOURCE_FEED_LIST_URL: ${AWIN_SOURCE_FEED_LIST_URL:-}
      AWIN_SOURCE_FEED_REGION: ${AWIN_SOURCE_FEED_REGION:-US}
      AWIN_SOURCE_FEED_LANGUAGE: ${AWIN_SOURCE_FEED_LANGUAGE:-English}
      AWIN_SOURCE_FEED_URL: ${AWIN_SOURCE_FEED_URL:-}
      AWIN_SOURCE_FEED_URL_2: ${AWIN_SOURCE_FEED_URL_2:-}
      AWIN_SOURCE_ALLOWED_HOSTS: ${AWIN_SOURCE_ALLOWED_HOSTS:-productdata.awin.com,datafeed.api.productserve.com,ui.awin.com}
      AWIN_FEED_API_TOKEN: ${AWIN_FEED_API_TOKEN:-}
      AWIN_FEED_DATA_PATH: /data/current.csv.gz
      AWIN_REFRESH_INTERVAL_MINUTES: ${AWIN_REFRESH_INTERVAL_MINUTES:-360}
      AWIN_SOURCE_RESPONSE_TIMEOUT_MS: ${AWIN_SOURCE_RESPONSE_TIMEOUT_MS:-15000}
      AWIN_SOURCE_BODY_TIMEOUT_MS: ${AWIN_SOURCE_BODY_TIMEOUT_MS:-45000}
      AWIN_SOURCE_RETRY_ATTEMPTS: ${AWIN_SOURCE_RETRY_ATTEMPTS:-2}
      AWIN_SOURCE_RETRY_BASE_DELAY_MS: ${AWIN_SOURCE_RETRY_BASE_DELAY_MS:-1000}
      AWIN_FEED_STALE_AFTER_MINUTES: ${AWIN_FEED_STALE_AFTER_MINUTES:-480}
      AWIN_FEED_SERVICE_HOST: 0.0.0.0
      AWIN_FEED_SERVICE_PORT: 3010
    ports: ["127.0.0.1:3010:3010"]
    volumes: ["awin_feed_data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    cpus: 0.5
    mem_limit: 128m

volumes:
  awin_feed_data:
