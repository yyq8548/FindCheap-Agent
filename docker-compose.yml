# Development-only dependencies. Do not expose these local credentials in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: shopping
    ports: ["5432:5432"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  commerce-api:
    profiles: ["commerce"]
    build:
      context: .
      dockerfile: infra/docker/commerce-api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${COMMERCE_DATABASE_URL:-}
      COMMERCE_API_TOKEN: ${COMMERCE_API_TOKEN:-}
      COMMERCE_API_HOST: 0.0.0.0
      COMMERCE_API_PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
